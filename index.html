<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a2b">
<title>Tv-guide</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" aria-live="polite"></div>
<footer class="sizes">
  <span id="sizeLabel">Tekststørrelse</span>
  <div role="group" aria-labelledby="sizeLabel">
    <button type="button" data-size="1" aria-label="Mindre tekst" style="font-size:1rem">A</button>
    <button type="button" data-size="2" aria-label="Vanlig tekst" style="font-size:1.4rem">A</button>
    <button type="button" data-size="3" aria-label="Større tekst" style="font-size:1.9rem">A</button>
  </div>
</footer>
<script src="app.js"></script>
</body>
</html>
